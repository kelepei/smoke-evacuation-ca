<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Runtime Viewer · Prototype</title>
<style>body{margin:0;font:14px/1.45 "Microsoft YaHei",Arial;background:#edf2f7;color:#172033}#app{height:100vh;display:grid;grid-template-columns:320px 1fr}aside{padding:18px;background:#fff;border-right:1px solid #cbd5e1;overflow:auto}h1{font-size:18px;margin:0 0 10px}h2{font-size:13px;margin:18px 0 7px}input,button{width:100%;box-sizing:border-box;margin:5px 0;padding:8px;border:1px solid #b7c5d6;border-radius:6px;background:#fff}button{font-weight:700;cursor:pointer}.notice{padding:9px;border-radius:6px;background:#f8fafc;color:#64748b;font-size:12px}.ok{background:#f0fdf4;color:#166534}.warn{background:#fff7ed;color:#9a3412}#stage{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}#hud{position:absolute;left:14px;top:14px;max-width:440px;padding:8px 10px;border:1px solid #bcd0e8;border-radius:7px;background:rgba(255,255,255,.93);font-size:12px}.small{font-size:12px;color:#64748b}.kv{display:grid;grid-template-columns:1fr auto;gap:8px;padding:5px 0;border-bottom:1px dashed #dbe4ef}.kv b{max-width:175px;overflow-wrap:anywhere;text-align:right}</style>
<body><div id="app"><aside><h1>3D Runtime Viewer</h1><div class="notice warn" id="state">Runtime unavailable：请选择真实 normalized snapshot。</div><p class="small">Prototype only。使用 Three.js CDN；不含仿真逻辑、不会生成假人员/烟雾/指导。</p><h2>真实 Snapshot JSON</h2><input id="file" type="file" accept="application/json,.json"><button id="loadFile">加载文件</button><h2>或显式 API / JSON URL</h2><input id="url" placeholder="例如真实 snapshot JSON URL"><button id="loadUrl">读取 URL</button><h2>Runtime</h2><div id="meta" class="small">尚无真实数据。</div><h2>说明</h2><div class="small">墙/障碍物→挤出网格；人员 x/y→x/z；烟场→半透明地表柱；推荐出口→黄色高亮。烟雾仅为字段可视化，非 CFD 体积烟。</div></aside><main id="stage"><div id="hud">等待真实 normalized snapshot</div></main></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const stage=document.querySelector('#stage'), state=document.querySelector('#state'), meta=document.querySelector('#meta'), hud=document.querySelector('#hud');
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio); stage.append(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeaf1f8); const camera=new THREE.PerspectiveCamera(52,1,.1,2000); camera.position.set(12,14,16); const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,0,0); controls.update(); scene.add(new THREE.HemisphereLight(0xffffff,0x526477,2)); const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(8,12,4);scene.add(light);
let root=new THREE.Group();scene.add(root), people=new Map(), previous=new Map();
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function cellType(grid,x,y){return String((grid.cell_type[y]||[])[x]||'free').toLowerCase()}
function clear(){root.removeFromParent();root=new THREE.Group();scene.add(root);people.clear()}
function valid(s){return s&&s.grid&&Number.isInteger(s.grid.width)&&Number.isInteger(s.grid.height)&&Array.isArray(s.grid.cell_type)&&Array.isArray(s.people)&&s.fields}
function load(snapshot){if(!valid(snapshot))throw Error('不是完整 normalized snapshot（缺 grid / people / fields）');clear();const g=snapshot.grid,scale=1, w=g.width,h=g.height, offsetX=-w/2,offsetZ=-h/2;
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({color:0xdfe8f1}));floor.rotation.x=-Math.PI/2;root.add(floor);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const t=cellType(g,x,y),px=offsetX+x+.5,pz=offsetZ+y+.5;if(t==='wall'||t==='obstacle'){const mesh=new THREE.Mesh(new THREE.BoxGeometry(.96,t==='wall'?2:.7,.96),new THREE.MeshStandardMaterial({color:t==='wall'?0x26364a:0x7d8999}));mesh.position.set(px,t==='wall'?1:.35,pz);root.add(mesh)}if(t==='exit'){const mesh=new THREE.Mesh(new THREE.BoxGeometry(.88,.08,.88),new THREE.MeshStandardMaterial({color:0x22c55e,emissive:0x0e8a3a}));mesh.position.set(px,.05,pz);root.add(mesh)}}
 const alarms=Array.isArray(snapshot.alarm_cells)?snapshot.alarm_cells:(Array.isArray(g.alarm_cells)?g.alarm_cells:[]);alarms.forEach(marker=>{const x=Number(marker&&marker.x),y=Number(marker&&marker.y);if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>=w||y>=h)return;const mesh=new THREE.Mesh(new THREE.TorusGeometry(.28,.055,8,18),new THREE.MeshBasicMaterial({color:0xdc2626}));mesh.rotation.x=Math.PI/2;mesh.position.set(offsetX+x+.5,.12,offsetZ+y+.5);root.add(mesh)});
 const smoke=snapshot.fields.smoke_field;if(Array.isArray(smoke)&&smoke.length===h)for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=Number((smoke[y]||[])[x]);if(Number.isFinite(v)&&v>0){const mesh=new THREE.Mesh(new THREE.BoxGeometry(.82,Math.min(1.5,v*1.5),.82),new THREE.MeshBasicMaterial({color:0x94a3b8,transparent:true,opacity:Math.min(.55,v*.55)}));mesh.position.set(offsetX+x+.5,mesh.geometry.parameters.height/2+.06,offsetZ+y+.5);root.add(mesh)}}
 const recommended=new Set((snapshot.guidance&&snapshot.guidance.recommendations||[]).filter(r=>r&&r.feasible).map(r=>r.recommended_exit_entity));(snapshot.exit_entities||[]).forEach(e=>{if(!recommended.has(e.exit_entity_id))return;(e.member_cells||[]).forEach(([x,y])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.98,.12,.98),new THREE.MeshBasicMaterial({color:0xf59e0b}));m.position.set(offsetX+x+.5,.13,offsetZ+y+.5);root.add(m)})});
 snapshot.people.filter(p=>p&&!p.evacuated).forEach(p=>{const key=String(p.person_id),m=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.45,4,8),new THREE.MeshStandardMaterial({color:0x2563eb}));m.position.set(offsetX+p.x+.5,.34,offsetZ+p.y+.5);const old=previous.get(key);if(old){const dx=p.x-old.x,dy=p.y-old.y;if(dx||dy)m.rotation.y=Math.atan2(dx,dy)}previous.set(key,{x:p.x,y:p.y});people.set(key,m);root.add(m)});
 controls.target.set(0,0,0);camera.position.set(Math.max(w,h)*.9,Math.max(w,h)*1.05,Math.max(w,h)*1.1);controls.update();const alarm=snapshot.fields.alarm_triggered, guidance=snapshot.guidance||{};state.className='notice ok';state.textContent=`真实 snapshot 已加载：alarm=${alarm??'NA'}；guidance=${guidance.status??'unavailable'}`;hud.textContent=`step ${snapshot.step??'NA'} · ${snapshot.time_s??'NA'} s · persons ${snapshot.people.length} · alarm ${alarm??'NA'}`;meta.innerHTML=`<div class="kv"><span>Grid</span><b>${w} × ${h}</b></div><div class="kv"><span>Smoke source</span><b>${snapshot.fields.max_smoke_source??'NA'}</b></div><div class="kv"><span>Guidance</span><b>${guidance.status??'unavailable'}</b></div><div class="kv"><span>Physical scale</span><b>${snapshot.grid.physical_cell_size_m??'unavailable'}</b></div>`}
document.querySelector('#loadFile').onclick=async()=>{const f=document.querySelector('#file').files[0];if(!f)return;try{load(JSON.parse(await f.text()))}catch(e){state.textContent=`Runtime unavailable：${e.message}`;state.className='notice warn'}};
document.querySelector('#loadUrl').onclick=async()=>{const url=document.querySelector('#url').value.trim();if(!url)return;try{const r=await fetch(url);if(!r.ok)throw Error(`HTTP ${r.status}`);load(await r.json())}catch(e){state.textContent=`Runtime unavailable：${e.message}`;state.className='notice warn'}};
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
